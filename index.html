<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>RavenSub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h1>🦅 RavenSub</h1>
  <p>Escolha a plataforma e gere seu link</p>

  <select id="platform">
    <option value="">Selecione a plataforma</option>
    <option value="youtube">YouTube</option>
    <option value="tiktok">TikTok</option>
    <option value="kwai">Kwai</option>
    <option value="instagram">Instagram</option>
    <option value="whatsapp_grupo">WhatsApp Grupo</option>
    <option value="whatsapp_canal">WhatsApp Canal</option>
  </select>

  <input id="link" type="text" placeholder="Cole o link aqui">

  <button id="gerar" style="display:none;" onclick="gerarLink()">
    Gerar Link
  </button>

  <div id="resultado"></div>
</div>

<script src="script.js"></script>
</body>
</html>
